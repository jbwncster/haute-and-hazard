name: Build v7.9 physical and TTS artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/v7_9_card_database.csv
      - data/v7_9_queen_database.csv
      - data/v7_9_stage_database.csv
      - scripts/validate_v7_9.py
      - scripts/builders/build_v7_9_assets.py.gz.b64
      - scripts/builders/build_solo_v0_2_assets.py.gz.b64
      - .github/workflows/build-v7.9-artifacts.yml

permissions:
  contents: write

concurrency:
  group: build-v7-9-artifacts
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check pillow reportlab

      - name: Validate canonical v7.9 data
        run: python scripts/validate_v7_9.py

      - name: Decode and run base physical/TTS builder
        shell: bash
        run: |
          base64 -d scripts/builders/build_v7_9_assets.py.gz.b64 | gzip -d > /tmp/build_v7_9_assets.py
          python /tmp/build_v7_9_assets.py "$GITHUB_WORKSPACE"

      - name: Decode and run Solo Circuit v0.2 builder
        shell: bash
        run: |
          rm -rf /tmp/solo-build
          mkdir -p /tmp/solo-build
          base64 -d scripts/builders/build_solo_v0_2_assets.py.gz.b64 | gzip -d > /tmp/solo-build/build_solo_v0_2_assets.py
          python /tmp/solo-build/build_solo_v0_2_assets.py
          cp -a /tmp/solo-build/out/releases/solo-circuit-v0.2/. releases/solo-circuit-v0.2/

      - name: Assert required outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s releases/v7.9/Haute_Hazard_v7.9_Game_Crafter_Print_Edition.zip
          test -s releases/v7.9/Haute_Hazard_v7_9_Print_and_Play_Physical_Kit.zip
          test -s releases/v7.9/Haute_Hazard_v7.9_TTS_Playtest.zip
          test -s releases/v7.9/TTS/Haute_Hazard_v7_9_TTS_Playtest.json
          test -s releases/v7.9/BUILD_MANIFEST.json
          test -s releases/v7.9/PRINT_PREFLIGHT_REPORT.txt
          test -s releases/solo-circuit-v0.2/Haute_Hazard_Solo_Circuit_v0_2_Print_and_Play.zip
          test -s releases/solo-circuit-v0.2/Haute_Hazard_Solo_Circuit_v0_2_TTS.zip
          test -s releases/solo-circuit-v0.2/TTS/Haute_Hazard_Solo_Circuit_v0_2_TTS_AddOn.json
          test -s releases/solo-circuit-v0.2/CHECKSUMS.sha256
          test "$(find releases/v7.9/TTS/Assets -maxdepth 1 -name 'v7_9_poker_sheet_*.jpg' | wc -l)" -eq 8
          test "$(find releases/solo-circuit-v0.2/Production/Automa -maxdepth 1 -name '*.png' | wc -l)" -eq 18
          test "$(find releases/solo-circuit-v0.2/Production/Personalities -maxdepth 1 -name '*.png' | wc -l)" -eq 12
          ! grep -R -n -E 'Tip Count|count printed Tips from.*hand' releases/v7.9/TTS releases/solo-circuit-v0.2/TTS

      - name: Upload workflow artifact copy
        uses: actions/upload-artifact@v4
        with:
          name: haute-hazard-v7.9-physical-and-tts
          path: |
            releases/v7.9/Haute_Hazard_v7.9_Game_Crafter_Print_Edition.zip
            releases/v7.9/Haute_Hazard_v7_9_Print_and_Play_Physical_Kit.zip
            releases/v7.9/Haute_Hazard_v7.9_TTS_Playtest.zip
            releases/solo-circuit-v0.2/Haute_Hazard_Solo_Circuit_v0_2_Print_and_Play.zip
            releases/solo-circuit-v0.2/Haute_Hazard_Solo_Circuit_v0_2_TTS.zip
          if-no-files-found: error

      - name: Commit generated release files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/v7.9 releases/solo-circuit-v0.2
          if git diff --cached --quiet; then
            echo "Generated artifacts already match the repository."
            exit 0
          fi
          git commit -m "Build v7.9 physical and TTS artifacts [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
