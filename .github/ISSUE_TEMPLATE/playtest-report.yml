name: Playtest report
description: Report a Haute & Hazard playtest session, rules issue, or balance concern.
title: "[Playtest] "
labels: ["playtest"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing **Haute & Hazard**. Please use files from the same version and describe what actually happened at the table before suggesting a balance change. The current physical and digital balance-test target is **v7.8**.

        **† Legal/IP review:** `Dragdagulan` is working prototype terminology credited to *Drag Den Philippines*. It is subject to legal/IP, trademark, and publisher review before commercial release and may be renamed. See `docs/ATTRIBUTIONS.md`.

  - type: dropdown
    id: version
    attributes:
      label: Version tested
      options:
        - v7.8 Physical — Game Crafter
        - v7.8 Digital — Tabletop Simulator
        - v7.7 Core Playtest Set — legacy
        - v7.7 Tabletop Simulator — legacy
        - v7.7.1 Game Crafter — archived legacy reference
        - Other / mixed build
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Rules mode
      description: Beginner Mode uses only Favored Tenet, Featured Brand, Slay Target, Reward, and Venue Effect on Stages.
      options:
        - Beginner Mode
        - Full Stage rules
        - Mixed / modified teaching game
    validations:
      required: true

  - type: input
    id: players
    attributes:
      label: Player count
      placeholder: "Example: 2"
    validations:
      required: true

  - type: input
    id: queens
    attributes:
      label: Queens used
      placeholder: "Example: Siren Diesel vs. Opal Dynasty"
    validations:
      required: true

  - type: input
    id: duration
    attributes:
      label: Game length
      placeholder: "Example: 55 minutes"

  - type: textarea
    id: result
    attributes:
      label: Result
      description: Include winner, Gross SP / Final Score, and Stage trophies if known.
      placeholder: "Who won and what were the final scores?"
    validations:
      required: true

  - type: textarea
    id: stages
    attributes:
      label: Stage results
      description: Note which venue Stages appeared and who Slayed them. If using full Stage rules, also record Judge's Favors and Brand Ovations.

  - type: textarea
    id: beginner_mode
    attributes:
      label: Beginner Mode teaching notes
      description: If this was a Beginner Mode game, what was easy to learn, what still caused confusion, and did ignoring the Judge/Spotlight layer help?

  - type: textarea
    id: looks
    attributes:
      label: Coordinate and Look notes
      description: Record Matching, Perfect Illusion, Fusion, simultaneous Matching + Fusion, or any difficult Look-state rulings.

  - type: textarea
    id: shopping
    attributes:
      label: Shopping and deck-building notes
      description: Note Wardrobe purchases, Tip availability, Thrift purchases, or cards that felt too cheap/expensive.

  - type: textarea
    id: dragdagulan
    attributes:
      label: Dragdagulan† notes
      description: Record attempts, winners, Battle Scores, unusual LS interactions, and penalties received. † Working term subject to legal/IP review.

  - type: textarea
    id: queen_abilities
    attributes:
      label: Queen abilities and Special Appeals
      description: Note which abilities were used, whether the once-per-game Special Appeal mattered, and any unclear timing.

  - type: textarea
    id: unclear
    attributes:
      label: Confusing rule or card text
      description: Quote the exact rule/card wording when possible and explain what happened before the question came up.

  - type: textarea
    id: balance
    attributes:
      label: Balance observations
      description: What felt too strong, too weak, too slow, too easy, or too difficult? Please separate observation from proposed fix.

  - type: checkboxes
    id: confirm
    attributes:
      label: Version check
      options:
        - label: I confirmed which version's files were used and noted above if this was a mixed-version test.
          required: true
