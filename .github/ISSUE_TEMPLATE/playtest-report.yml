name: "Playtest feedback — mixed / other build"
description: "Use this only when the session does not fit the dedicated v7.9, Solo v0.2, v7.8, or v7.7 forms."
title: "[Mixed Build Playtest] "
labels: ["playtest"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for **mixed-version, home-modified, prototype, or otherwise unlisted builds**.

        Current v7.9, Solo Circuit v0.2, v7.8, and v7.7-series sessions each have their own dedicated feedback form.

  - type: dropdown
    id: build_type
    attributes:
      label: What kind of build was tested?
      options:
        - Mixed-version build
        - Home-modified / house-rule build
        - Unreleased prototype
        - Unknown version
        - Other
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions / files used
      placeholder: "Example: v7.9 cards with v7.8 rules"
    validations:
      required: true

  - type: dropdown
    id: format
    attributes:
      label: Format
      options:
        - Physical / Print & Play
        - Game Crafter prototype
        - Tabletop Simulator
        - Other digital
        - Mixed
    validations:
      required: true

  - type: dropdown
    id: players
    attributes:
      label: Player count
      options:
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
        - Other
    validations:
      required: true

  - type: dropdown
    id: purpose
    attributes:
      label: Purpose of the test
      options:
        - Rules experiment
        - Balance experiment
        - Component / print test
        - Comparison between versions
        - Teaching / demo
        - Casual play
        - Other
    validations:
      required: true

  - type: textarea
    id: changes
    attributes:
      label: What differed from an official version?
      description: List house rules, swapped files, experimental rules, or other changes.
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: Result / observations
      description: Winner, scores, length, major interactions, or production observations.

  - type: dropdown
    id: usefulness
    attributes:
      label: How useful should this report be for current v7.9 development?
      options:
        - Directly relevant
        - Useful comparison only
        - Mostly production / usability feedback
        - Historical interest
        - Not sure
    validations:
      required: true

  - type: textarea
    id: issues
    attributes:
      label: Confusing rules, balance issues, or production problems

  - type: textarea
    id: fun
    attributes:
      label: Best moment / one change

  - type: checkboxes
    id: confirm
    attributes:
      label: Mixed-build check
      options:
        - label: I listed the version differences so this report is not mistaken for synchronized current-build data.
          required: true
